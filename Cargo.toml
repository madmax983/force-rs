[workspace]
resolver = "2"
members = ["fuzz", "crates/force", "crates/force-marketingcloud", "crates/force-pubsub", "crates/force-sync", "crates/force-lake"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
authors = ["Mark M"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/madmax983/force-rs"
homepage = "https://github.com/madmax983/force-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.42", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Security
secrecy = { version = "0.10", features = ["serde"] }

# Encoding
base64 = "0.22"
url = "2.5"

# Cryptography (feature-gated: auth_code PKCE)
sha2 = "0.10"
getrandom = "0.2"

# Logging
tracing = "0.1"

# Async utilities
futures = "0.3"
async-trait = "0.1"
bytes = "1.9"
blake3 = "1.5"
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }

# Encoding
percent-encoding = "2.3"

# Feature-gated dependencies
jsonwebtoken = "9.3"
csv = "1.3"
quick-xml = "0.41"
wiremock = "0.6"

# gRPC/Protobuf (for pub_sub)
tonic = "0.13"
prost = "0.13"
apache-avro = "0.21"
dashmap = "6"
tokio-stream = "0.1"

# Build dependencies (for pub_sub proto compilation)
tonic-build = "0.13"
prost-build = "0.13"
protoc-bin-vendored = "3.0"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# aws-smithy-json 0.63.0 (pulled transitively by force-lake's iceberg-catalog-s3tables ->
# aws-config/aws-sdk-{sso,ssooidc,sts,s3tables}) does not compile against aws-smithy-types
# 1.7.0's new `Document::Object(DocumentObject)` shape -- it still passes a raw `HashMap`.
# No published aws-config/aws-sdk-* release yet requires the fixed aws-smithy-json 0.64.0
# (their Cargo.toml manifests pin `^0.63.0`, which excludes it), and aws-smithy-types is
# independently forced to 1.7.0 by aws-smithy-runtime, so neither side can be unpinned to
# route around this. `vendor/aws-smithy-json-0.63.0` is the upstream 0.63.0 source with the
# three one-line fixes `rustc` itself suggests (two `.into()` conversions using
# `DocumentObject`'s own `From<HashMap<String, Document>>` impl, plus a wildcard match arm
# for `Document` being `#[non_exhaustive]`). Remove this patch once crates.io has an
# aws-config/aws-sdk-* release that requires aws-smithy-json >=0.64.
[patch.crates-io]
aws-smithy-json = { path = "vendor/aws-smithy-json-0.63.0" }
