[workspace]
resolver = "2"
members = ["crates/force"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mark M"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/madmax983/force-rs"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.42", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Security
secrecy = { version = "0.10", features = ["serde"] }

# Encoding
base64 = "0.22"
url = "2.5"

# Logging
tracing = "0.1"

# Async utilities
futures = "0.3"
async-trait = "0.1"
bytes = "1.9"

# Feature-gated dependencies
jsonwebtoken = "9.3"
csv = "1.3"
quick-xml = "0.37"
wiremock = "0.6"

# gRPC/Protobuf (for pub_sub)
tonic = "0.12"
prost = "0.13"
apache-avro = "0.17"
