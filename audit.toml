# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/config/index.html
#
# Keep this ignore list in sync with the [advisories] section of deny.toml:
# cargo-deny's `cargo deny check` already accepts these three advisories with
# documented rationale, but cargo-audit is a separate tool with its own config
# file and does not read deny.toml, so the Security Audit workflow job
# (`cargo audit --deny warnings`) was failing on advisories the project has
# already triaged and accepted.

[advisories]
ignore = [
    # rustls-pemfile is unmaintained but still pulled transitively by tonic 0.12.x.
    # Track this until force-pubsub moves off the dependency chain.
    "RUSTSEC-2025-0134",
    # `paste` is unmaintained with no safe upgrade available. Pulled transitively via
    # parquet -> iceberg / iceberg-catalog-s3tables (Apache Iceberg + AWS S3 Tables tree).
    # Informational (unmaintained) advisory; drop once the Iceberg tree moves off `paste`.
    "RUSTSEC-2024-0436",
    # quick-xml < 0.41 denial-of-service advisories (CPU-quadratic duplicate-attribute
    # check and unbounded NsReader namespace-declaration allocation). The fix requires
    # quick-xml >= 0.41, which is pinned out by the Iceberg 0.9 tree: opendal 0.55
    # requires quick-xml ^0.38 and reqsign 0.16 requires ^0.37 (both transitive via
    # iceberg-catalog-s3tables). No upstream fix until those crates relax the pin. In
    # force-lake the XML parsed is AWS S3 responses over TLS, not attacker-controlled
    # untrusted input. Remove these once quick-xml >= 0.41 is unified in the tree.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
