name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (skip actual publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  # ── Gate: run full CI checks before publishing ──────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --lib --tests -- --test-threads=1

  # ── Publish crates to crates.io in dependency order ─────────────────
  publish:
    name: Publish to crates.io
    needs: validate
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2

      - name: Determine if dry run
        id: dry-run
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
            echo "Running in DRY RUN mode"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
            echo "Running in PUBLISH mode"
          fi

      - name: Check published crate versions
        id: published
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

          check_published() {
            local crate="$1"
            local output_name="$2"
            if curl -fsSL "https://crates.io/api/v1/crates/${crate}/${version}" >/dev/null; then
              echo "${output_name}=true" >> "$GITHUB_OUTPUT"
              echo "${crate} ${version} is already published; skipping upload."
            else
              echo "${output_name}=false" >> "$GITHUB_OUTPUT"
              echo "${crate} ${version} is not published yet; upload required."
            fi
          }

          check_published force force
          check_published force-pubsub force_pubsub
          check_published force-sync force_sync

      # Publish in dependency order: force -> force-pubsub -> force-sync
      - name: Publish force
        if: steps.dry-run.outputs.flag != '' || steps.published.outputs.force != 'true'
        run: cargo publish -p force ${{ steps.dry-run.outputs.flag }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        if: steps.dry-run.outputs.flag == '' && steps.published.outputs.force != 'true'
        run: sleep 30

      - name: Publish force-pubsub
        if: steps.dry-run.outputs.flag != '' || steps.published.outputs.force_pubsub != 'true'
        run: cargo publish -p force-pubsub ${{ steps.dry-run.outputs.flag }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for crates.io index
        if: steps.dry-run.outputs.flag == '' && steps.published.outputs.force_pubsub != 'true'
        run: sleep 30

      - name: Publish force-sync
        if: steps.dry-run.outputs.flag != '' || steps.published.outputs.force_sync != 'true'
        run: cargo publish -p force-sync ${{ steps.dry-run.outputs.flag }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ── Create GitHub Release with notes ────────────────────────────────
  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        id: changelog
        run: |
          version="${{ steps.version.outputs.version }}"
          # Strip leading 'v' for changelog lookup
          semver="${version#v}"
          # Extract the section for this version from CHANGELOG.md
          changelog=$(awk "/^## \\[${semver}\\]/{found=1; next} /^## \\[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$changelog" ]; then
            changelog="Release ${version}"
          fi
          # Write to file to preserve multiline
          echo "$changelog" > /tmp/release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
