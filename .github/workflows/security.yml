name: Security Audit

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: '0 3 * * *'
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  pull_request:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
  workflow_dispatch:
    # Allow manual triggering

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # Keep in sync with the [advisories] ignore list in deny.toml: cargo-deny's
      # `cargo deny check` already accepts these advisories with documented
      # rationale, but cargo-audit is a separate tool with no config-file support
      # for advisory exceptions (only the --ignore flag), so the exceptions have
      # to be repeated here explicitly.
      - name: Set cargo-audit ignore flags
        id: audit_ignores
        run: |
          echo "flags=--ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195" >> "$GITHUB_OUTPUT"

      - name: Run cargo audit
        run: cargo audit --json ${{ steps.audit_ignores.outputs.flags }} > audit-results.json
        continue-on-error: true

      - name: Check for vulnerabilities
        id: check
        run: |
          if cargo audit --deny warnings ${{ steps.audit_ignores.outputs.flags }}; then
            echo "status=passed" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-results
          path: audit-results.json
          retention-days: 90

      - name: Generate summary
        if: always()
        run: |
          echo "## Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check.outputs.status }}" == "passed" ]; then
            echo "✅ No known vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Vulnerabilities detected - see details below" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cargo audit 2>&1 | head -n 50 >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR (if vulnerabilities found)
        if: github.event_name == 'pull_request' && steps.check.outputs.status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ⚠️ Security Audit Alert

            This PR introduces or modifies dependencies with known vulnerabilities.

            Please review the [security audit results](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and update dependencies as needed.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  cargo-deny:
    name: License and Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Check licenses and advisories
        run: |
          # Create basic deny.toml if it doesn't exist
          if [ ! -f deny.toml ]; then
            cat > deny.toml << 'EOF'
          [advisories]
          db-path = "~/.cargo/advisory-db"
          db-urls = ["https://github.com/rustsec/advisory-db"]
          vulnerability = "deny"
          unmaintained = "warn"
          yanked = "warn"
          notice = "warn"

          [licenses]
          unlicensed = "deny"
          allow = [
              "MIT",
              "Apache-2.0",
              "Apache-2.0 WITH LLVM-exception",
              "BSD-2-Clause",
              "BSD-3-Clause",
              "ISC",
              "Unicode-DFS-2016",
          ]
          copyleft = "warn"

          [bans]
          multiple-versions = "warn"
          wildcards = "warn"

          [sources]
          unknown-registry = "deny"
          unknown-git = "deny"
          EOF
          fi

          cargo deny check

      - name: Generate summary
        if: always()
        run: |
          echo "## License and Dependency Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checked licenses, advisories, and dependency sources." >> $GITHUB_STEP_SUMMARY
