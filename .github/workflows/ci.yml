name: CI

on:
  push:
    branches: [trunk, trunk-dev, main]
  pull_request:
    branches: [trunk, trunk-dev, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gates:
    name: Fast Gates (fmt + clippy + unit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

      - name: Unit-focused tests (all features)
        run: cargo test --workspace --all-features --lib --tests -- --test-threads=1

  force-sync-postgres:
    name: force-sync Postgres Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: force_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d force_sync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORCE_SYNC_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/force_sync_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run force-sync ignored Postgres tests
        run: cargo test -p force-sync -- --ignored --test-threads=1

  full-matrix:
    name: Full Matrix (${{ matrix.rust }})
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        rust: [stable, nightly]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (no features)
        run: cargo test --workspace --no-default-features

      - name: Run tests (default features)
        run: cargo test --workspace

      - name: Run tests (all features)
        run: cargo test --workspace --all-features -- --test-threads=1

      - name: Run doc tests
        run: cargo test --workspace --doc --all-features

  cross-platform:
    name: Cross-Platform Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build_args: "--workspace --all-features"
          - os: windows-latest
            build_args: "--workspace --exclude force-fuzz --all-features"
          - os: macos-latest
            build_args: "--workspace --exclude force-fuzz --all-features"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build ${{ matrix.build_args }}

      - name: Run smoke tests
        run: cargo test --workspace --all-features --lib
