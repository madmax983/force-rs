name: Code Coverage

on:
  push:
    branches: [trunk, trunk-dev, main]
  pull_request:
    branches: [trunk, trunk-dev, main]
  workflow_dispatch:
    # Allow manual triggering

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      contents: read
    # The force-sync `#[ignore]` tests need only this database, so coverage
    # runs them too. The live_* tests stay out (see codecov.yml).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: force_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d force_sync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FORCE_SYNC_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/force_sync_test
      FORCE_SYNC_TEST_HARVEST_SHARD1_URL: postgres://postgres:postgres@127.0.0.1:5432/force_sync_test_shard1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      # The second harvest shard for the multi-shard durable sync test.
      - name: Create the second harvest shard database
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -c "create database force_sync_test_shard1"

      - name: Generate coverage report
        run: |
          cargo tarpaulin \
            --workspace \
            --all-features \
            --timeout 600 \
            --exclude-files 'vendor/*' \
            --out Xml \
            --out Html \
            --output-dir ./coverage \
            -- --test-threads 1

      # The ptrace engine segfaults on the harvest worker threads, so this
      # run uses the LLVM engine. Codecov merges both uploads.
      - name: Generate force-sync Postgres coverage report
        run: |
          cargo tarpaulin \
            --engine llvm \
            -p force-sync \
            --features durable \
            --timeout 600 \
            --exclude-files 'vendor/*' \
            --out Xml \
            --output-dir ./coverage-postgres \
            -- --ignored --test-threads 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/cobertura.xml,./coverage-postgres/cobertura.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-postgres/
          retention-days: 30

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract coverage percentage from XML
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1 || echo "0")
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)
          echo "percentage=$COVERAGE_PCT" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE_PCT%"

      - name: Generate summary
        if: always()
        run: |
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f coverage/cobertura.xml ]; then
            COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1 || echo "0")
            COVERAGE_PCT=$(printf "%.2f" $(echo "$COVERAGE * 100" | bc))

            echo "**Overall Coverage:** ${COVERAGE_PCT}%" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if (( $(echo "$COVERAGE_PCT >= 85" | bc -l) )); then
              echo "✅ Coverage meets or exceeds 85% target" >> $GITHUB_STEP_SUMMARY
            elif (( $(echo "$COVERAGE_PCT >= 70" | bc -l) )); then
              echo "⚠️ Coverage is below 85% target but above 70%" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Coverage is below 70% - consider adding more tests" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Note: Coverage thresholds are informational only for now." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full HTML report available in artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report generation failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.percentage }}';
            const coverageNum = parseFloat(coverage);

            let icon = '📊';
            let status = 'informational';
            if (coverageNum >= 85) {
              icon = '✅';
              status = 'excellent';
            } else if (coverageNum >= 70) {
              icon = '⚠️';
              status = 'good';
            } else {
              icon = '❌';
              status = 'needs improvement';
            }

            const comment = `## ${icon} Code Coverage Report

            **Coverage:** ${coverage}% (${status})

            [View detailed report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            *Note: Coverage is tracked but not enforced.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
