name: Code Coverage

on:
  push:
    branches: [trunk, main]
  pull_request:
    branches: [trunk, main]
  workflow_dispatch:
    # Allow manual triggering

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Generate coverage report
        run: |
          cargo tarpaulin \
            --workspace \
            --all-features \
            --timeout 600 \
            --out Xml \
            --out Html \
            --output-dir ./coverage \
            -- --test-threads 1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/cobertura.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
          retention-days: 30

      - name: Extract coverage percentage
        id: coverage
        run: |
          # Extract coverage percentage from XML
          COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1 || echo "0")
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc)
          echo "percentage=$COVERAGE_PCT" >> $GITHUB_OUTPUT
          echo "Coverage: $COVERAGE_PCT%"

      - name: Generate summary
        if: always()
        run: |
          echo "## Code Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f coverage/cobertura.xml ]; then
            COVERAGE=$(grep -oP 'line-rate="\K[0-9.]+' coverage/cobertura.xml | head -1 || echo "0")
            COVERAGE_PCT=$(printf "%.2f" $(echo "$COVERAGE * 100" | bc))

            echo "**Overall Coverage:** ${COVERAGE_PCT}%" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if (( $(echo "$COVERAGE_PCT >= 85" | bc -l) )); then
              echo "✅ Coverage meets or exceeds 85% target" >> $GITHUB_STEP_SUMMARY
            elif (( $(echo "$COVERAGE_PCT >= 70" | bc -l) )); then
              echo "⚠️ Coverage is below 85% target but above 70%" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Coverage is below 70% - consider adding more tests" >> $GITHUB_STEP_SUMMARY
            fi

            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Note: For v0.1, coverage thresholds are informational only." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full HTML report available in artifacts." >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage report generation failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const coverage = '${{ steps.coverage.outputs.percentage }}';
            const coverageNum = parseFloat(coverage);

            let icon = '📊';
            let status = 'informational';
            if (coverageNum >= 85) {
              icon = '✅';
              status = 'excellent';
            } else if (coverageNum >= 70) {
              icon = '⚠️';
              status = 'good';
            } else {
              icon = '❌';
              status = 'needs improvement';
            }

            const comment = `## ${icon} Code Coverage Report

            **Coverage:** ${coverage}% (${status})

            [View detailed report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            *Note: For v0.1, coverage is tracked but not enforced.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
