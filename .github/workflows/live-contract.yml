name: Live Contract Tests

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  live-contract:
    name: Salesforce Live Contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ── JWT Bearer (primary, renewable) ──
      SF_JWT_CLIENT_ID: ${{ secrets.SF_JWT_CLIENT_ID }}
      SF_JWT_USERNAME: ${{ secrets.SF_JWT_USERNAME }}
      # Accepts a bare host, base URL, or full /services/oauth2/token endpoint.
      SF_JWT_LOGIN_URL: ${{ vars.SF_JWT_LOGIN_URL || secrets.SF_JWT_LOGIN_URL || 'https://login.salesforce.com' }}

      # ── Client Credentials ──
      SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
      SF_CLIENT_SECRET: ${{ secrets.SF_CLIENT_SECRET }}
      # Set explicitly for the target org/environment. Accepts the org base URL
      # or full /services/oauth2/token endpoint.
      SF_TOKEN_URL: ${{ vars.SF_TOKEN_URL || secrets.SF_TOKEN_URL }}

      # ── Username-Password ──
      SF_UP_CLIENT_ID: ${{ secrets.SF_UP_CLIENT_ID }}
      SF_UP_CLIENT_SECRET: ${{ secrets.SF_UP_CLIENT_SECRET }}
      SF_UP_USERNAME: ${{ secrets.SF_UP_USERNAME }}
      SF_UP_PASSWORD: ${{ secrets.SF_UP_PASSWORD }}
      SF_UP_SECURITY_TOKEN: ${{ secrets.SF_UP_SECURITY_TOKEN }}
      # Accepts a bare host, base URL, or full /services/oauth2/token endpoint.
      SF_UP_TOKEN_URL: ${{ vars.SF_UP_TOKEN_URL || secrets.SF_UP_TOKEN_URL || 'https://login.salesforce.com/services/oauth2/token' }}

      # ── Bare token fallback (deprecated, kept for migration) ──
      SF_ACCESS_TOKEN: ${{ secrets.SF_ACCESS_TOKEN }}
      SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}

      # ── Shared config ──
      SF_API_VERSION: ${{ vars.SF_API_VERSION || 'v62.0' }}
      SF_LIVE_TEST_TIMEOUT_SECS: ${{ vars.SF_LIVE_TEST_TIMEOUT_SECS || '180' }}
      SF_LIVE_BULK_POLL_MAX_ATTEMPTS: ${{ vars.SF_LIVE_BULK_POLL_MAX_ATTEMPTS || '12' }}
      SF_LIVE_BULK_POLL_INITIAL_BACKOFF_MS: ${{ vars.SF_LIVE_BULK_POLL_INITIAL_BACKOFF_MS || '1000' }}
      SF_LIVE_BULK_POLL_MAX_BACKOFF_MS: ${{ vars.SF_LIVE_BULK_POLL_MAX_BACKOFF_MS || '30000' }}
      SF_LIVE_BULK_QUERY_ROW_LIMIT: ${{ vars.SF_LIVE_BULK_QUERY_ROW_LIMIT || '5' }}
      SF_LIVE_RUN_PARTIAL_FAILURE: ${{ vars.SF_LIVE_RUN_PARTIAL_FAILURE || '0' }}
      SF_LIVE_RUN_THROTTLE: ${{ vars.SF_LIVE_RUN_THROTTLE || '0' }}
      SF_LIVE_THROTTLE_MAX_REQUESTS: ${{ vars.SF_LIVE_THROTTLE_MAX_REQUESTS || '5000' }}

      # Pub/Sub unary contract smoke. Topic must exist and be accessible.
      SF_PUBSUB_ENDPOINT: ${{ vars.SF_PUBSUB_ENDPOINT || 'https://api.pubsub.salesforce.com:7443' }}
      SF_PUBSUB_TOPIC: ${{ vars.SF_PUBSUB_TOPIC || secrets.SF_PUBSUB_TOPIC }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write JWT private key to file
        if: ${{ env.SF_JWT_CLIENT_ID != '' }}
        env:
          SF_JWT_PRIVATE_KEY: ${{ secrets.SF_JWT_PRIVATE_KEY }}
        run: |
          if [ -z "$SF_JWT_PRIVATE_KEY" ]; then
            echo "SF_JWT_PRIVATE_KEY secret is required when SF_JWT_CLIENT_ID is set" >&2
            exit 1
          fi
          printf '%b' "$SF_JWT_PRIVATE_KEY" > /tmp/jwt_live_key.pem
          chmod 600 /tmp/jwt_live_key.pem
          echo "SF_JWT_PRIVATE_KEY_PATH=/tmp/jwt_live_key.pem" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run force live tests
        run: cargo test -p force --all-features --test live_salesforce -- --ignored --test-threads=1

      - name: Run Pub/Sub live tests
        run: cargo test -p force-pubsub --test live_salesforce_pubsub -- --ignored --test-threads=1

      - name: Cleanup private key
        if: always()
        run: rm -f /tmp/jwt_live_key.pem
