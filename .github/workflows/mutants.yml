name: Mutation Testing

on:
  schedule:
    # Run weekly on Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    # Allow manual triggering

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Run mutation tests
        run: |
          cargo mutants --no-shuffle -j 2 --workspace --all-features -- --all-targets
        continue-on-error: true

      - name: Archive mutants output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: |
            mutants.out/
            mutants.out.json
          retention-days: 30

      - name: Generate summary
        if: always()
        run: |
          if [ -f mutants.out.json ]; then
            echo "## Mutation Testing Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Full report available in artifacts." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Extract key metrics if available
            if command -v jq &> /dev/null; then
              echo "### Summary" >> $GITHUB_STEP_SUMMARY
              jq -r '.summary | to_entries | .[] | "- \(.key): \(.value)"' mutants.out.json >> $GITHUB_STEP_SUMMARY || true
            fi
          else
            echo "Mutation testing output not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('mutants.out.json')) {
              const results = JSON.parse(fs.readFileSync('mutants.out.json', 'utf8'));
              const comment = `## 🧬 Mutation Testing Results

              Full report available in [workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

              Note: For v0.1, mutation score is informational only.`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
