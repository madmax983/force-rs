[package]
name = "force-sync"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"
description = "Correctness-first bidirectional Salesforce and Postgres sync engine"
keywords = ["salesforce", "postgres", "sync", "cdc", "crm"]
categories = ["api-bindings", "database"]
documentation = "https://docs.rs/force-sync"
homepage = "https://github.com/madmax983/force-rs"
readme = "README.md"

[lints]
workspace = true

[dependencies]
force = { path = "../force", version = "0.5.0", features = ["rest", "bulk", "composite"] }
force-pubsub = { path = "../force-pubsub", version = "0.5.0" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
deadpool-postgres = { workspace = true }
tokio-postgres = { workspace = true }
blake3 = { workspace = true }
secrecy.workspace = true
autumn-harvest = { workspace = true, optional = true }
async-trait = { workspace = true }

[features]
default = []
# Run capture, apply and reconcile as autumn-harvest durable workflows.
# Needs Rust 1.88 or later (the autumn-harvest MSRV).
durable = ["dep:autumn-harvest"]

[dev-dependencies]
# The live CDC contract test authenticates with every ADR-033 flow.
force = { path = "../force", version = "0.5.0", features = ["jwt", "username_password"] }
anyhow = { workspace = true }
async-trait = { workspace = true }
proptest = "1.7"
wiremock = { workspace = true }
autumn-harvest = { workspace = true, features = ["testing"] }

[[bench]]
name = "plan_change_profile"
harness = false

[[test]]
name = "durable_sync"
required-features = ["durable"]

[[example]]
name = "durable_sync"
required-features = ["durable"]
