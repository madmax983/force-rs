[package]
name = "force-lake"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.92"
description = "One-way Salesforce to S3 Tables / Apache Iceberg analytics snapshot sink"
keywords = ["salesforce", "iceberg", "s3tables", "analytics", "parquet"]
categories = ["api-bindings", "database"]
documentation = "https://docs.rs/force-lake"
homepage = "https://github.com/madmax983/force-rs"
readme = "README.md"

[lints]
workspace = true

[dependencies]
force = { path = "../force", version = "0.3.0", features = ["rest", "bulk", "schema"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
iceberg = "0.9.1"
iceberg-catalog-s3tables = "0.9.1"
arrow-array = "57"
arrow-schema = "57"
parquet = "57"
bytes.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
force = { path = "../force", version = "0.3.0", features = ["rest", "bulk", "schema"] }
bytes.workspace = true
