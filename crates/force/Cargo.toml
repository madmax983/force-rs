[package]
name = "force"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Production-ready Salesforce Platform API client with REST and Bulk API 2.0 support"
keywords = ["salesforce", "api", "rest", "bulk", "crm"]
categories = ["api-bindings", "web-programming"]
documentation = "https://docs.rs/force"
homepage = "https://github.com/madmax983/force-rs"
readme = "README.md"
autoexamples = false

[lints]
workspace = true

[dependencies]
# Core dependencies (always compiled)
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }

# Feature-gated dependencies
jsonwebtoken = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
apache-avro = { workspace = true, optional = true }
wiremock = { workspace = true, optional = true }

[dev-dependencies]
tokio-test = "0.4"
anyhow = { workspace = true }
wiremock = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1.5"

[features]
default = ["rest"]

# Platform API surfaces
rest = []
bulk = ["dep:csv"]
composite = ["rest"]
tooling = ["rest"]
metadata = []
graphql = []
pub_sub = ["dep:tonic", "dep:prost", "dep:apache-avro"]
streaming = []
analytics = ["rest"]
connect = ["rest"]
apex_rest = ["rest"]
ui = ["rest"]
soap = ["dep:quick-xml"]

# Auth flows
jwt = ["dep:jsonwebtoken"]

# Testing utilities
mock = ["dep:wiremock"]

# Meta features
full = ["rest", "bulk", "composite", "tooling", "metadata",
        "graphql", "analytics", "connect", "apex_rest", "ui", "jwt"]
all = ["full", "pub_sub", "streaming", "soap"]

# Experimental features
nova = []

[[example]]
name = "basic_crud"
required-features = ["rest"]

[[example]]
name = "describe"
required-features = ["rest"]

[[example]]
name = "org_limits"
required-features = ["rest"]

[[example]]
name = "search"
required-features = ["rest"]

[[example]]
name = "soql_query"
required-features = ["rest"]

[[example]]
name = "dynamic_query"
required-features = ["rest"]

[[example]]
name = "bulk_insert"
required-features = ["bulk"]

[[example]]
name = "bulk_update"
required-features = ["bulk"]

[[example]]
name = "bulk_delete"
required-features = ["bulk"]

[[example]]
name = "bulk_query"
required-features = ["bulk"]

[[example]]
name = "bulk_error_handling"
required-features = ["bulk"]
