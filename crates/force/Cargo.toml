[package]
name = "force"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Production-ready Salesforce Platform API client with REST and Bulk API 2.0 support"
keywords = ["salesforce", "api", "rest", "bulk", "crm"]
categories = ["api-bindings", "web-programming"]
documentation = "https://docs.rs/force"
homepage = "https://github.com/madmax983/force-rs"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# Core dependencies (always compiled)
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
secrecy = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
percent-encoding = { workspace = true }

# Feature-gated dependencies
jsonwebtoken = { workspace = true, optional = true }
csv = { workspace = true, optional = true }
wiremock = { workspace = true, optional = true }

[dev-dependencies]
loom = "0.7"
tokio-test = "0.4"
anyhow = { workspace = true }
wiremock = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1.5"

[features]
nova = ["rest"]
default = ["rest"]

# Platform API surfaces
rest = []
bulk = ["dep:csv"]
composite = ["rest"]

# Auth flows
jwt = ["dep:jsonwebtoken"]

# Testing utilities
mock = ["dep:wiremock"]

# Meta features
full = ["rest", "bulk", "composite", "jwt"]
all = ["full"]

[[example]]
name = "query_plan"
required-features = ["nova"]

[[example]]
name = "data_dictionary"
required-features = ["nova"]

[[example]]
name = "generate_struct"
required-features = ["nova"]
