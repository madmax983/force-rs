# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Check for security vulnerabilities in dependencies
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # rustls-pemfile is unmaintained but still pulled transitively by tonic 0.12.x.
    # Track this until force-pubsub moves off the dependency chain.
    "RUSTSEC-2025-0134",
]

[licenses]
version = 2
# Ensure all dependencies use acceptable licenses
confidence-threshold = 0.8
allow = [
    "NCSA",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]

# Allow specific crates with unusual license situations
[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Deny specific crates or crate versions
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

# Allow certain crates to have multiple versions (common with proc-macros)
skip = []

# Skip dependencies that are only used in dev/build contexts
skip-tree = []

[sources]
# Only allow dependencies from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
