# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

# Global configuration
# version = 2 must be at the top level
version = 2

[advisories]
# Check for security vulnerabilities in dependencies
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Ignore advisories for specific crate versions
ignore = []

[licenses]
# Ensure all dependencies use acceptable licenses
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "0BSD",
    "Zlib",
    "MPL-2.0",
]
# Copyleft licenses we explicitly deny
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-2.0",
    "LGPL-2.1",
    "LGPL-3.0",
]
# Warn on licenses not explicitly allowed or denied
unlicensed = "deny"
copyleft = "deny"

# Allow specific crates with unusual license situations
[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Deny specific crates or crate versions
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

# Allow certain crates to have multiple versions (common with proc-macros)
skip = []

# Skip dependencies that are only used in dev/build contexts
skip-tree = []

[sources]
# Only allow dependencies from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
