# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# Check for security vulnerabilities in dependencies
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # rustls-pemfile is unmaintained but still pulled transitively by tonic 0.12.x.
    # Track this until force-pubsub moves off the dependency chain.
    "RUSTSEC-2025-0134",
    # `paste` is unmaintained with no safe upgrade available. Pulled transitively via
    # parquet -> iceberg / iceberg-catalog-s3tables (Apache Iceberg + AWS S3 Tables tree).
    # Informational (unmaintained) advisory; drop once the Iceberg tree moves off `paste`.
    "RUSTSEC-2024-0436",
    # quick-xml < 0.41 denial-of-service advisories (CPU-quadratic duplicate-attribute
    # check and unbounded NsReader namespace-declaration allocation). The fix requires
    # quick-xml >= 0.41, which is pinned out by the Iceberg 0.9 tree: opendal 0.55
    # requires quick-xml ^0.38 and reqsign 0.16 requires ^0.37 (both transitive via
    # iceberg-catalog-s3tables). No upstream fix until those crates relax the pin. In
    # force-lake the XML parsed is AWS S3 responses over TLS, not attacker-controlled
    # untrusted input. Remove these once quick-xml >= 0.41 is unified in the tree.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
version = 2
# Ensure all dependencies use acceptable licenses
confidence-threshold = 0.8
allow = [
    "NCSA",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "Zlib",
    # CC0-1.0 is a public-domain dedication (permissive, no copyleft). Pulled
    # transitively via tiny-keccak <- reqsign <- iceberg-catalog-s3tables (AWS S3
    # Tables tree).
    "CC0-1.0",
]

# Allow specific crates with unusual license situations
[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Deny specific crates or crate versions
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

# Allow certain crates to have multiple versions (common with proc-macros)
skip = []

# Skip dependencies that are only used in dev/build contexts
skip-tree = []

[sources]
# Only allow dependencies from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
