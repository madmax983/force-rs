[package]
name = "force-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
force = { path = "../crates/force" }

[[bin]]
name = "soql_escape"
path = "fuzz_targets/soql_escape.rs"
test = false
doc = false

[[bin]]
name = "sosl_escape"
path = "fuzz_targets/sosl_escape.rs"
test = false
doc = false

[[bin]]
name = "fuzz_http_error"
path = "fuzz_targets/fuzz_http_error.rs"
test = false
doc = false

[[bin]]
name = "fuzz_salesforce_id"
path = "fuzz_targets/fuzz_salesforce_id.rs"
test = false
doc = false

[[bin]]
name = "fuzz_soql_builder"
path = "fuzz_targets/fuzz_soql_builder.rs"
test = false
doc = false
