[package]
name = "force-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
force = { path = "../crates/force" }

[[bin]]
name = "soql_escape"
path = "fuzz_targets/soql_escape.rs"
test = false
doc = false

[[bin]]
name = "sosl_escape"
path = "fuzz_targets/sosl_escape.rs"
test = false
doc = false
